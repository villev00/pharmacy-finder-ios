name: iOS build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Select available iPhone simulator
        id: simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"]))
          candidates = [(runtime, device) for runtime, devices in data["devices"].items()
                        if ".iOS-" in runtime for device in devices
                        if device.get("isAvailable") and device["name"].startswith("iPhone")]
          if not candidates:
              raise SystemExit("No available iPhone simulator")
          candidates.sort(key=lambda entry: tuple(map(int, entry[0].split(".iOS-")[1].split("-"))), reverse=True)
          device = candidates[0][1]
          print(f"Using {device['name']} ({device['udid']})")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"udid={device['udid']}\n")
          PY
      - name: Build and run unit and UI tests
        run: |
          set -o pipefail
          mkdir -p artifacts
          xcodebuild test \
            -project NearbyPharmacy.xcodeproj \
            -scheme NearbyPharmacy \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -parallel-testing-enabled NO \
            -resultBundlePath artifacts/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee artifacts/xcodebuild.log
      - name: Upload build log, test results, and UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: artifacts
          retention-days: 7
